name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          mkdir project
          unzip -q ./*.zip -d project

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            find project -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          echo "Gradle wrapper found: $GRADLEW"

          chmod +x "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dafatery-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
